name: Update Servers
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Xray-core
        run: |
          curl -L -sS https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip -o /tmp/xray.zip
          unzip -q -o /tmp/xray.zip xray -d /usr/local/bin
          chmod +x /usr/local/bin/xray
          rm -f /tmp/xray.zip
      - run: python checker.py
      - run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Server Bot"
          git add sub.txt
          git commit -m "Update sub" || exit 0
          git push
