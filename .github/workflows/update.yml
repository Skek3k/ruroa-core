name: Update Servers
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python checker.py
      - run: |
          git config --local user.email "bot@github.com"
          git config --local user.name "Server Bot"
          git add sub.txt
          git commit -m "Update sub" || exit 0
          git push
